<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>F 题 Q3 资源配置与条件优化流程</title>
  <style>
    :root {
      /* 与同目录 Q1 / Q2 流程图保持一致：Okabe–Ito 描边、白色节点 */
      --ink: #20252b;
      --blue: #0072b2;
      --sky: #56b4e9;
      --green: #009e73;
      --amber: #e69f00;
      --vermillion: #d55e00;
      --purple: #cc79a7;
      --grey: #68717b;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; color: var(--ink); }

    body {
      padding: 24px 16px 32px;
      font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
    }

    figure { width: min(1280px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }

    .node-title {
      fill: var(--ink);
      font: 700 20px "Songti SC", "SimSun", "STSong", serif;
      text-anchor: middle;
    }

    .node-text {
      fill: var(--ink);
      font: 18px "Songti SC", "SimSun", "STSong", serif;
      text-anchor: middle;
    }

    .compact { font-size: 16px; }

    .gate-title { font-size: 15px; }
    .gate-compact { font-size: 15px; }

    .branch-label {
      fill: var(--vermillion);
      font: 700 16px "Songti SC", "SimSun", "STSong", serif;
      text-anchor: middle;
    }

    .technical {
      font-family: "Cascadia Mono", "Consolas", "Noto Sans Mono CJK SC", monospace;
      letter-spacing: 0;
    }

    @media print {
      body { padding: 0; }
      figure { width: 100%; }
    }
  </style>
</head>
<body>
  <figure>
    <svg viewBox="0 0 1280 1256" role="img" aria-labelledby="q3-resource-title q3-resource-desc">
      <title id="q3-resource-title">F 题 Q3 资源配置与条件优化流程</title>
      <desc id="q3-resource-desc">以 Q1 冻结的 Q0、Q2 的 M0 与 B1 实测 N/D 网格、成本预算和 C7 架构记录为输入。M3 限定观测支持域，M4 计算预算可行性，M1 在固定 Q0 下进行离散配置筛选，再开展稳健性分析和条件性 Q-only 分析。当前 p 与 Loss 缺少可追溯联接，独立 Q 响应也未识别，因此完整经验 Q/p 联合最优暂不可估。</desc>

      <defs>
        <marker id="q3-resource-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
          <path d="M0 0 L10 4 L0 8 Z" fill="#20252b" />
        </marker>
      </defs>

      <!-- 分支与汇合连线置于节点下层 -->
      <g fill="none" stroke="#20252b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q3-resource-arrow)">
        <path d="M640 112 V152" />

        <path d="M432 272 V296 Q432 304 424 304 H328 Q320 304 320 312 V336" />
        <path d="M848 272 V296 Q848 304 856 304 H952 Q960 304 960 312 V336" />

        <path d="M320 448 V464 Q320 472 328 472 H504 Q512 472 512 480 V496" />
        <path d="M960 448 V464 Q960 472 952 472 H776 Q768 472 768 480 V496" />

        <path d="M512 608 V632 Q512 640 504 640 H328 Q320 640 320 648 V664" />
        <path d="M768 608 V632 Q768 640 776 640 H952 Q960 640 960 648 V664" />

        <path d="M320 792 V1024 Q320 1032 328 1032 H488 Q496 1032 496 1040 V1112" />
        <path d="M960 792 V870" />
        <path d="M960 1050 V1072 Q960 1080 952 1080 H792 Q784 1080 784 1088 V1112" />
      </g>

      <!-- 门禁出口标签与连线留白 -->
      <rect x="970" y="1058" width="88" height="24" rx="4" fill="#ffffff" />
      <text x="1014" y="1076" class="branch-label">未通过</text>

      <!-- 输入 -->
      <path d="M280 24 H1000 L1024 112 H256 Z" fill="#ffffff" stroke="#0072b2" stroke-width="2.4" />
      <text x="640" y="56" class="node-title">冻结上游接口与题面参数</text>
      <text x="640" y="84" class="node-text compact"><tspan class="technical">Q₀=0.4985</tspan>；Q2 的 <tspan class="technical">M0</tspan> 与 B1 实测 <tspan class="technical">1,176</tspan> 组 <tspan class="technical">(N,D)</tspan></text>

      <!-- C7 情景网格 -->
      <rect x="240" y="152" width="800" height="120" rx="6" fill="#ffffff" stroke="#68717b" stroke-width="2.2" />
      <text x="640" y="180" class="node-title">C7 审计与情景网格</text>
      <text x="640" y="206" class="node-text compact">45 条架构记录 → 5 个候选上下文长度</text>
      <text x="640" y="230" class="node-text compact">3 档预算 × 5 个上下文 = 15 个情景</text>
      <text x="640" y="254" class="node-text compact">架构最大长度不直接等同部署窗口</text>

      <!-- M3 支持域 -->
      <rect x="48" y="336" width="544" height="112" rx="6" fill="#ffffff" stroke="#009e73" stroke-width="2.4" />
      <text x="320" y="366" class="node-title">M3：观测支持域掩码</text>
      <text x="320" y="396" class="node-text compact">只放行 B1 实测的 1,176 组 <tspan class="technical">(N,D)</tspan></text>
      <text x="320" y="424" class="node-text compact">未观测点不插值、不外推</text>

      <!-- M4 预算可行域 -->
      <rect x="688" y="336" width="544" height="112" rx="6" fill="#ffffff" stroke="#e69f00" stroke-width="2.4" />
      <text x="960" y="366" class="node-title">M4：成本与预算可行性</text>
      <text x="960" y="396" class="node-text compact"><tspan class="technical">Ctrain=6ND</tspan>；<tspan class="technical">Cattn=ηNDLctx</tspan></text>
      <text x="960" y="424" class="node-text compact">固定 <tspan class="technical">Q=Q₀</tspan>，故 <tspan class="technical">CQ=0</tspan></text>

      <!-- M1 固定 Q0 优化 -->
      <rect x="240" y="496" width="800" height="112" rx="6" fill="#ffffff" stroke="#0072b2" stroke-width="2.4" />
      <text x="640" y="526" class="node-title">M1：固定 <tspan class="technical">Q₀</tspan> 的离散配置筛选</text>
      <text x="640" y="556" class="node-text compact">合并 <tspan class="technical">M3</tspan> 支持域与 <tspan class="technical">M4</tspan> 预算可行掩码</text>
      <text x="640" y="584" class="node-text compact">在冻结 <tspan class="technical">M0</tspan> 预测 Loss 上求最低点，得到 15 个参考配置</text>

      <!-- 稳健性与敏感性 -->
      <rect x="48" y="664" width="544" height="128" rx="6" fill="#ffffff" stroke="#e69f00" stroke-width="2.4" />
      <text x="320" y="694" class="node-title">T2 / T3 与模型形式稳健性</text>
      <text x="320" y="722" class="node-text compact">近优解、Pareto 前沿与边际收益</text>
      <text x="320" y="750" class="node-text compact">Bootstrap、情景切换与整轨迹留一</text>
      <text x="320" y="778" class="node-text compact">只检验 <tspan class="technical">M0 / B1</tspan> 有限支持域内稳定性</text>

      <!-- 条件性 Q-only 分析 -->
      <rect x="688" y="664" width="544" height="128" rx="6" fill="#ffffff" stroke="#cc79a7" stroke-width="2.4" />
      <text x="960" y="694" class="node-title">T4：<tspan class="technical">Q</tspan>-only 条件优化</text>
      <text x="960" y="722" class="node-text compact"><tspan class="technical">Lcond=LM0−βQ(Q−Q₀), βQ≥0</tspan></text>
      <text x="960" y="750" class="node-text compact"><tspan class="technical">βQ</tspan> 未由数据识别；<tspan class="technical">p</tspan> 未进入决策</text>
      <text x="960" y="778" class="node-text compact">报告条件阈值，不称经验最优</text>

      <!-- 完整联合优化证据门禁 -->
      <path d="M960 870 L1140 960 L960 1050 L780 960 Z" fill="#ffffff" stroke="#d55e00" stroke-width="2.4" />
      <text x="960" y="932" class="node-title gate-title"><tspan class="technical">Q/p</tspan> 联合门禁？</text>
      <text x="960" y="956" class="node-text gate-compact">需 <tspan class="technical">p-Loss</tspan> 可追溯联接</text>
      <text x="960" y="980" class="node-text gate-compact">控 <tspan class="technical">N/D</tspan> 后仍有独立 <tspan class="technical">Q</tspan></text>
      <text x="960" y="1004" class="node-text gate-compact">当前未通过</text>

      <!-- 当前可支持的结论 -->
      <rect x="200" y="1112" width="880" height="128" rx="20" fill="#ffffff" stroke="#20252b" stroke-width="2.4" />
      <text x="640" y="1140" class="node-title">Q3 当前可支持的结果</text>
      <text x="640" y="1168" class="node-text compact">固定 <tspan class="technical">Q₀</tspan> + 冻结 <tspan class="technical">M0</tspan> + B1 网格：有限域参考配置与稳健性</text>
      <text x="640" y="1192" class="node-text compact"><tspan class="technical">T4</tspan> 仅给条件敏感性；完整经验 <tspan class="technical">Q/p</tspan> 联合最优未识别</text>
      <text x="640" y="1216" class="node-text compact">高预算情景触及 B1 支持域上界，不向外推断</text>
    </svg>
  </figure>
</body>
</html>
