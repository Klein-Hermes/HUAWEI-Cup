<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q1.2 冲突分析与污染敏感性流程</title>
  <style>
    :root {
      /* Okabe–Ito 色盲安全配色；底色透明，节点以白底和彩色描边区分 */
      --ink: #20252b;
      --blue: #0072b2;
      --sky: #56b4e9;
      --green: #009e73;
      --amber: #e69f00;
      --vermillion: #d55e00;
      --purple: #cc79a7;
      --grey: #68717b;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; color: var(--ink); }

    body {
      padding: 24px 16px 32px;
      font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
    }

    figure { width: min(1200px, 100%); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }

    .node-title {
      fill: var(--ink);
      font: 700 20px "Songti SC", "SimSun", "STSong", serif;
      text-anchor: middle;
    }

    .node-text {
      fill: var(--ink);
      font: 18px "Songti SC", "SimSun", "STSong", serif;
      text-anchor: middle;
    }

    .technical {
      font-family: "Cascadia Mono", "Consolas", "Noto Sans Mono CJK SC", monospace;
      letter-spacing: 0;
    }

    .note {
      fill: #20252b;
      font: 18px "Microsoft YaHei", "Noto Sans SC", sans-serif;
      text-anchor: middle;
    }

    @media print {
      body { padding: 0; }
      figure { width: 100%; }
    }
  </style>
</head>
<body>
  <figure>
    <svg viewBox="0 0 1200 704" role="img" aria-labelledby="q1-conflict-title q1-conflict-desc">
      <title id="q1-conflict-title">Q1.2 冲突分析与污染敏感性流程</title>
      <desc id="q1-conflict-desc">主分析从冻结标准化指标出发，计算相关结构、样本冲突度及 A1 阈值；随后比较高冲突组、复核 A2 和 A3 同名域，并用两种 A1 Unicode 标记重估校准参数，最终汇总区间、排序稳定性与适用边界。</desc>

      <defs>
        <marker id="conflict-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
          <path d="M0 0 L10 4 L0 8 Z" fill="#20252b" />
        </marker>
        <marker id="conflict-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
          <path d="M0 0 L10 4 L0 8 Z" fill="#d55e00" />
        </marker>
      </defs>

      <!-- 主流程与复核支路：深色直线 / 圆角正交箭头 -->
      <g fill="none" stroke="#20252b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#conflict-arrow)">
        <path d="M296 104 H336" />
        <path d="M560 104 H616" />
        <path d="M816 104 H872" />

        <path d="M952 144 V184 Q952 192 944 192 H556 Q548 192 548 200 V244" />
        <path d="M1056 144 V184 Q1056 192 1048 192 H988 Q980 192 980 200 V244" />

        <path d="M548 332 V468 Q548 476 556 476 H652 Q660 476 660 484 V516" />
        <path d="M980 332 V468 Q980 476 972 476 H924 Q916 476 916 484 V516" />
      </g>

      <!-- Unicode 敏感性支路 -->
      <g fill="none" stroke="#d55e00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#conflict-arrow-accent)">
        <path d="M176 144 V252" />
        <path d="M184 324 V372" />
        <path d="M184 464 V516" />
        <path d="M304 552 H396" />
      </g>

      <!-- 主分析链 -->
      <path d="M56 64 H272 L296 144 H80 Z" fill="#ffffff" stroke="#0072b2" stroke-width="2.4" />
      <text x="176" y="90" class="node-title">冻结公共预处理</text>
      <text x="176" y="116" class="node-text">A1–A3 <tspan class="technical">norm_*</tspan></text>
      <text x="176" y="138" class="node-text">只读指标与审计标记</text>

      <rect x="336" y="64" width="224" height="80" rx="6" fill="#ffffff" stroke="#68717b" stroke-width="2.2" />
      <text x="448" y="92" class="node-title">指标结构诊断</text>
      <text x="448" y="118" class="node-text">成对 Spearman 相关</text>
      <text x="448" y="140" class="node-text">与绝对分差</text>

      <rect x="616" y="64" width="200" height="80" rx="6" fill="#ffffff" stroke="#009e73" stroke-width="2.2" />
      <text x="716" y="94" class="node-title">样本冲突度</text>
      <text x="716" y="122" class="node-text technical">D_s</text>
      <text x="716" y="142" class="node-text">有效指标对内计算</text>

      <rect x="872" y="64" width="264" height="80" rx="6" fill="#ffffff" stroke="#0072b2" stroke-width="2.4" />
      <text x="1004" y="92" class="node-title">A1 域内阈值与区间</text>
      <text x="1004" y="118" class="node-text">按来源域冻结 <tspan class="technical">Q95</tspan></text>
      <text x="1004" y="140" class="node-text">记录阈值不确定性</text>

      <!-- 冲突比较与同域复核 -->
      <rect x="396" y="244" width="304" height="88" rx="6" fill="#ffffff" stroke="#e69f00" stroke-width="2.4" />
      <text x="548" y="274" class="node-title">高 / 非高冲突组比较</text>
      <text x="548" y="302" class="node-text">比较 <tspan class="technical">Q_H − Q_eq</tspan></text>
      <text x="548" y="326" class="node-text">检查差异方向与稳定性</text>

      <rect x="820" y="244" width="316" height="88" rx="6" fill="#ffffff" stroke="#009e73" stroke-width="2.4" />
      <text x="978" y="274" class="node-title">冻结阈值与排序</text>
      <text x="978" y="302" class="node-text">复核 A2 / A3 同名来源域</text>
      <text x="978" y="326" class="node-text">不在扩展集重新估计</text>

      <!-- A1 Unicode 敏感性 -->
      <path d="M56 252 H280 L304 324 H80 Z" fill="#ffffff" stroke="#d55e00" stroke-width="2.4" />
      <text x="180" y="278" class="node-title">A1 Unicode 审计</text>
      <text x="180" y="306" class="node-text">428 / 463 两种标记</text>

      <rect x="64" y="372" width="240" height="92" rx="6" fill="#ffffff" stroke="#d55e00" stroke-width="2.4" />
      <text x="184" y="400" class="node-title">分别重估 A1 校准</text>
      <text x="184" y="428" class="node-text">阈值、权重、Huber δ</text>
      <text x="184" y="452" class="node-text">与指标对排序</text>

      <rect x="64" y="516" width="240" height="72" rx="6" fill="#ffffff" stroke="#d55e00" stroke-width="2.4" />
      <text x="184" y="546" class="node-title">比较全量与清洁校准</text>
      <text x="184" y="574" class="node-text">仅作敏感性分组</text>

      <!-- 结论汇总 -->
      <rect x="396" y="516" width="740" height="88" rx="20" fill="#ffffff" stroke="#20252b" stroke-width="2.4" />
      <text x="766" y="548" class="node-title">汇总差值区间、排序稳定性与适用边界</text>
      <text x="766" y="578" class="node-text">主分析结论 + 跨数据集复核 + A1 校准敏感性并列报告</text>

      <line x1="64" y1="636" x2="1136" y2="636" stroke="#68717b" stroke-width="1" />
      <text x="600" y="662" class="note">标记只用于敏感性分组；原文不进入统计，不据此认定恶意，也不证明评分器免疫污染。</text>
      <text x="600" y="690" class="note">主分支只读冻结 <tspan class="technical">norm_*</tspan>；污染支路仅重估 A1 校准；A2 / A3 复核限于冻结评分表。</text>
    </svg>
  </figure>
</body>
</html>
