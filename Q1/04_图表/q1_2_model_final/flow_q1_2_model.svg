   <g id="text_11">
    <text style="font-size: 8px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #68717b" x="423.216" y="334.12722" transform="rotate(-0 423.216 334.12722)">标记只用于敏感性分组；原文不进入统计，不据此认定恶意，也不证明评分器免疫污染。</text>
