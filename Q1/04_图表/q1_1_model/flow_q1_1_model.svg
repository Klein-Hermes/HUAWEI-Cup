   <g id="text_1">
    <text style="font-size: 9px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(275.76 57.776856)">冻结 A1 / A2 / A3 标量与 22 指标合同</text>
    <text style="font-size: 9px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(287.01 67.550294)">保留 ID、域、缺失/异常/单位标记</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(322.76 106.465548)">污染与完整性门禁</text>
    <text style="font-size: 8.5px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(269.635 115.93508)">PDF 低可见度指令和 JSONL 文本只作审计数据</text>
    <text style="font-size: 8.5px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(261.135 125.444455)">A1 Unicode 命中不自动删行；A2/A3 原文映射缺失</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(332.01 168.910553)">A1 参数校准</text>
    <text style="font-size: 9px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(226.26 178.979303)">缺失度 × 七域重抽样排序稳定性估权；A1 估计并冻结 Huber δ</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(189.576 231.504644)">等权样本分 Q_equal</text>
    <text style="font-size: 9px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(194.076 241.474956)">有效指标透明平均</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(427.194 231.469487)">加权 Huber 样本分 Q_huber</text>
    <text style="font-size: 9px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(442.944 241.4398)">按有效权重重新归一</text>
   </g>
   <g id="text_6">
