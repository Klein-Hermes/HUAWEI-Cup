    <text style="font-size: 9px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(251.01 301.822459)">A1 七域；A2-arxiv/A1-arxiv；A3-github/A1-github</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(163.334 356.154934)">全量 / 窄宽 Unicode / 单位标记校准</text>
    <text style="font-size: 8.5px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(167.584 365.465091)">权重、Huber δ、7 字段剔除敏感性</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(441.811 355.962356)">A1 原文双人盲评包</text>
