   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'SimHei', 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(275.76 419.172709)">当前交付：候选评分与稳健性结果已计算</text>
